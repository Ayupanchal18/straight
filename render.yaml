services:
  - type: web
    name: cricket-hub-app
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        sync: false # Set your MongoDB Atlas connection string in Render dashboard
      - key: CACHE_TTL_LIVE
        value: 30
      - key: CACHE_TTL_SCHEDULE
        value: 3600
      - key: CACHE_TTL_PLAYERS
        value: 86400
      - key: RATE_LIMIT_MAX
        value: 300
      - key: ENABLE_KEEP_ALIVE
        value: true
